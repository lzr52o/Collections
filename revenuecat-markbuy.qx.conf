# MarkBuy Pro（RevenueCat 多合一）
# 原脚本作者：@ddgksf2013，脚本已收进 lzr52o/Collections：revenuecat.vip.js
# 内容：RevenueCat 多合一解锁，含 MarkBuy premium（原脚本 2024-07-08）
# 用法：QX 里添加此文件为远程配置链接，或把下面两段复制进你的配置

[rewrite_local]
# RevenueCat 响应改写
^https:\/\/api\.(revenuecat|rc-backup)\.com\/.+\/(receipts$|subscribers\/[^/]+$) url script-response-body https://raw.githubusercontent.com/lzr52o/Collections/master/revenuecat.vip.js
# RevenueCat 请求头处理
^https:\/\/api\.(revenuecat|rc-backup)\.com\/.+\/(receipts|subscribers) url script-request-header https://raw.githubusercontent.com/ddgksf2013/Scripts/master/deleteHeader.js

[mitm]
hostname = api.revenuecat.com, api.rc-backup.com
